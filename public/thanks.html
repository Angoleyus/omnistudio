<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniStudio | Thank You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f9f8f6;
            color: #2c2c2a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .icon { font-size: 3rem; margin-bottom: 2rem; }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 400;
            margin-bottom: 1.5rem;
        }
        h1 em { font-style: italic; color: #8a8377; }
        p {
            font-size: 1.1rem;
            color: #666;
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 3rem;
        }
        a {
            background-color: #2c2c2a;
            color: #f9f8f6;
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background-color 0.3s;
        }
        a:hover { background-color: #000; }
    </style>
</head>
<body>
    <div class="icon">✦</div>
    <h1>Your submission<br>has been <em>received.</em></h1>
    <p>We review every submission personally. If your product is selected, you will receive your complimentary editorial render within 48 hours.</p>
    <a href="/">Return to the Atelier</a>
</body>
</html>
